<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMMS Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f2f2;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 320px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 10px;
    background: #2d6cdf;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #1b4fb8;
}

a {
    display: block;
    margin-top: 10px;
    color: #2d6cdf;
    text-decoration: none;
}

.error {
    color: red;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="card">

    <h2>CMMS Login</h2>

    <!-- ERROR MESSAGE FROM FLASK -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label for="username">Username</label>
        <input id="username" name="username" placeholder="Enter username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>

    <a href="/register">Create Account</a>

</div>

</body>
</html>
